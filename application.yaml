server:
  port: 8080

spring:
  application:
    name: instrument-aggregation-service
  
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}:${ORACLE_SID:ORCL}
    username: ${ORACLE_USER:instruments_user}
    password: ${ORACLE_PASSWORD:changeme}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: InstrumentHikariPool
  
  jpa:
    database-platform: org.hibernate.dialect.Oracle12cDialect
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
    show-sql: false
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: instrument-aggregation-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 100
        max.poll.interval.ms: 300000
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
        connections.max.idle.ms: 540000
        request.timeout.ms: 60000
    
    listener:
      ack-mode: manual
      concurrency: 3
      poll-timeout: 3000
    
    retry:
      backoff:
        initial-interval: 2000
        max-interval: 30000
        multiplier: 2.0
      max-attempts: 5

# Application-specific configuration
instrument:
  # Kafka topics
  topics:
    equity-issue: instrument.equity.issue
    equity-trading-line: instrument.equity.trading-line
    bond-issue: instrument.bond.issue
    bond-trading-line: instrument.bond.trading-line
    structured-product-issue: instrument.structured-product.issue
    structured-product-trading-line: instrument.structured-product.trading-line
    warrant-issue: instrument.warrant.issue
    warrant-trading-line: instrument.warrant.trading-line
  
  # Pre-transform queue configuration
  pre-transform-queue:
    capacity: 50000
    offer-timeout-ms: 5000
  
  # Transformer worker pool configuration
  transformer:
    worker-count: 16
    poll-timeout-ms: 1000
    shutdown-timeout-seconds: 30
  
  # Writer queue configuration (partitioned)
  writer-queue:
    partition-count: 8
    capacity-per-partition: 5000
    offer-timeout-ms: 5000
    shutdown-timeout-seconds: 60
  
  # REST endpoints (for manual reload)
  rest:
    base-url: ${REST_API_BASE_URL:http://localhost:8081/api/v1}
    endpoints:
      equity-search: /equity/search
      bond-search: /bond/search
      structured-product-search: /structured-product/search
      warrant-search: /warrant/search
    timeout-ms: 5000
    max-retries: 3
    retry-backoff-ms: 1000
  
  # Version validation
  version-validation:
    enabled: true
    log-skipped: true

# Actuator & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  health:
    kafka:
      enabled: true

# Logging
logging:
  level:
    root: INFO
    com.example.instrument: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    AUDIT: INFO
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","thread":"%thread","logger":"%logger{36}","message":"%msg","correlation_id":"%X{correlationId}","instrument_id":"%X{instrumentId}","version":"%X{version}"}%n'
